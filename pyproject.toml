[project]
name = "vj"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
  "ffmpeg-normalize",
  "pyperclip",
  "yt-dlp",
  "yt-dlp-audio-normalize>=0.3.0",
]

[dependency-groups]
dev = [
  "pytest",
  "pytest-cov",
]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
extraPaths = ["scripts"]

[tool.pytest]
addopts = ["--cov-fail-under=90", "--cov-report=term-missing", "--cov=scripts"]
testpaths = ["scripts/tests"]

[tool.ruff]
target-version = "py314"
line-length = 88
indent-width = 4
preview = true
include = ["*.py", "*.pyi", "**/pyproject.toml"]
extend-exclude = [".vscode", ".idea"]
respect-gitignore = true
show-fixes = true
output-format = "full"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
docstring-code-format = true
docstring-code-line-length = 72

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D203",
  "D213",
  "COM812",
  "ISC001",
  "INP001",
  "FIX002",
  "TD002",
  "TD003",
  "ERA001",
  "T201",
  "D400",
  "D415",
]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?)|dummy|unused)$"
preview = true
explicit-preview-rules = true
typing-modules = ["typing", "typing_extensions"]
task-tags = [
  "TODO",
  "FIXME",
  "HACK",
  "BUG",
  "NOBUG",
  "REQ",
  "IDEA",
  "NOTE",
  "ISSUE",
  "XXX",
  "やること",
  "修正",
  "バグ",
  "ノート",
  "問題",
  "要修正",
  "要確認",
  "仮実装",
]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = false
ignore-fully-untyped = false
suppress-dummy-args = false
suppress-none-returning = false
mypy-init-return = true

[tool.ruff.lint.flake8-bandit]
check-typed-exception = true

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = []

[tool.ruff.lint.flake8-comprehensions]
allow-dict-calls-with-keyword-arguments = false

[tool.ruff.lint.flake8-errmsg]
max-string-length = 30

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = true
mark-parentheses = true
parametrize-names-type = "csv"
parametrize-values-type = "list"
parametrize-values-row-type = "tuple"

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"
multiline-quotes = "double"
docstring-quotes = "double"
avoid-escape = true

[tool.ruff.lint.flake8-self]
ignore-names = []

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-type-checking]
strict = true
exempt-modules = ["typing", "typing_extensions"]
runtime-evaluated-base-classes = [
  "pydantic.BaseModel",
  "sqlalchemy.orm.DeclarativeBase",
]
runtime-evaluated-decorators = [
  "attrs.define",
  "attrs.frozen",
  "dataclasses.dataclass",
]

[tool.ruff.lint.flake8-unused-arguments]
ignore-variadic-names = false

[tool.ruff.lint.isort]
force-single-line = false
force-wrap-aliases = true
combine-as-imports = true
split-on-trailing-comma = true
required-imports = []
known-first-party = []
section-order = [
  "future",
  "standard-library",
  "third-party",
  "first-party",
  "local-folder",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pep8-naming]
ignore-names = []
classmethod-decorators = [
  "classmethod",
  "pydantic.validator",
  "pydantic.field_validator",
]
staticmethod-decorators = ["staticmethod"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 88
ignore-overlong-task-comments = false

[tool.ruff.lint.pydocstyle]
convention = "google"
property-decorators = [
  "property",
  "cached_property",
  "functools.cached_property",
]

[tool.ruff.lint.pylint]
allow-magic-value-types = ["int", "str", "float"]
max-args = 5
max-bool-expr = 3
max-branches = 10
max-locals = 10
max-nested-blocks = 3
max-positional-args = 3
max-public-methods = 20
max-returns = 5
max-statements = 35

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.ruff.lint.per-file-ignores]
"scripts/tests/**/*.py" = [
  "S101",
  "S105",
  "S106",
  "S108",
  "ARG",
  "FBT",
  "PLR2004",
  "S311",
  "ANN",
  "PLR0913",
  "SLF001",
  "PLC0415",
  "TRY003",
  "TC002",
  "TC003",
  "B905",
]
"scripts/**/*.py" = ["S603", "S607"]
"scripts/audio_normalize.py" = ["S603", "S607", "E402"]

[tool.uv]
package = false
